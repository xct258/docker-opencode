services:
  app:
    # 部署前把这两行改成 app.conf 里的镜像名和想用的容器名
    image: xct258/opencode:latest
    container_name: opencode
    # 默认 host 网络：直接用宿主机端口，不需要 ports 映射
    # 想用桥接网络就注释掉这行，再打开下面的 ports
    network_mode: host
    restart: unless-stopped
    # 工作目录默认是 /；需要固定就取消注释（挂载代码后用 /workspace 之类）
    # working_dir: /workspace
    # 需要传给容器的变量，在这里加一行即可：KEY: 值
    environment:
      # Web 服务端口（host 网络下直接访问宿主机这个端口）
      PORT: 4096
      OPENCODE_PASSWORD: 换成你的密码
      # Git 推送令牌：有的话启动时配置 git 凭据，容器里可以直接 push
      # 不要命名为 GITHUB_TOKEN / GH_TOKEN，否则 OpenCode 会把它当成 Copilot 认证
      # GIT_PUSH_TOKEN: ghp_xxx
      # git 提交身份（可选）
      # GIT_USER_NAME: opencode
      # GIT_USER_EMAIL: opencode@users.noreply.github.com
      # 启动时检查 opencode 更新（有 update.sh 时默认开启）
      # UPDATE_ON_START: 1
      # 运行期每天 04:00 检查一次；装到新版本后只重启 main.sh，容器保持运行
      UPDATE_INTERVAL_DAYS: 1
      # 单次检查最长秒数（默认 60）
      # UPDATE_TIMEOUT: 60
      # 1 = 启动时更新失败按启动失败处理（默认 0：只告警，旧版本继续启动）
      # UPDATE_STRICT: 0
      # 1 = 装到新版本后立即重启服务（默认 1）
      # UPDATE_RESTART: 1
      # 日志文件目录（log.sh 写入，跟着数据卷走；不设就写进镜像内的 /opt/startup/logs）
      LOG_BASE_DIR: /data/logs
      # 服务日志（默认 /data/logs/opencode/opencode.log）
      # SERVICE_LOG_KEEP_DAYS: 15
      # 每个脚本保留多少个日志文件，默认 30
      # LOG_MAX_FILES: 30
    # host 网络下 ports 不生效
    # ports:
    #   - "8080:80"
    volumes:
      - ./data:/data
