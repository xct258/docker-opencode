services:
  app:
    # 部署前把这两行改成 app.conf 里的镜像名和想用的容器名
    image: xct258/my-image:latest
    container_name: my-image
    # 默认 host 网络：直接用宿主机端口，不需要 ports 映射
    # 想用桥接网络就注释掉这行，再打开下面的 ports
    network_mode: host
    restart: unless-stopped
    # 启动失败时 start.sh 会写 /data/.startup-failed 并停住，容器因此显示 Up (unhealthy)
    healthcheck:
      test: ["CMD-SHELL", "test ! -f /data/.startup-failed"]
      interval: 30s
      timeout: 3s
      retries: 3
      # 启动阶段给 prepare/once 留时间，期间不做判定
      start_period: 60s
    # 工作目录默认是 /；需要固定就取消注释（挂载代码后用 /workspace 之类）
    # working_dir: /workspace
    # 需要传给容器的变量，在这里加一行即可：KEY: 值
    environment:
      TZ: Asia/Shanghai
      # PORT: 8080
      # APP_PASSWORD: 换成你的密码
      # 启动失败后最多重试几次（0 = 不重试，打印原因后停住等排查）
      STARTUP_RETRY: 0
    # host 网络下 ports 不生效
    # ports:
    #   - "8080:80"
    # volumes:
    #   - ./data:/data
